name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - name: Formatting
              run: test -z "$(gofmt -l .)"
            - name: Vet
              run: go vet ./...
            - name: Lint
              run: |
                  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
                  golangci-lint run
            - name: Test
              run: go test -race ./...
